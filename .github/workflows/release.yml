name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: zip -qr "gonghunt-brand-${GITHUB_REF_NAME}.zip" logos mascot web social docs README.md LICENSE.md
      - run: gh release create "$GITHUB_REF_NAME" "gonghunt-brand-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
